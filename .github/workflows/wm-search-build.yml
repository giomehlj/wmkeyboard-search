name: WM Search Build

on:
  workflow_dispatch:

env:
  WMKB_ENABLE_PLAY_STORE: "false"
  WMKB_ENABLE_GMS: "false"
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx6g -Dorg.gradle.daemon=false

jobs:
  build:
    name: WM Search assemble intl debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wasi-master/wmkeyboard
          ref: v0.6.7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply keypad patch
        run: |
          python3 - <<'PY'
          import re
          p = "feature/ime/src/main/java/com/wasimaster/wmkeyboard/ime/WMKeyboardService.kt"
          s = open(p, encoding="utf-8").read()
          pat1 = re.compile(
              r"val context = snippetContext\(currentInputConnection, withSelection = false\)"
              r"(\s*\n\s*val chips = snippetStore\.items\(\)\.asSequence\(\)"
              r"\s*\n\s*\.filter \{ it\.trigger != null \|\| it\.triggerPattern\.isNullOrBlank\(\) \})"
          )
          if len(pat1.findall(s)) != 1:
              raise SystemExit("ERROR: keypadSnippetOffer block not found exactly once")
          s = pat1.sub(
              lambda m: "val context by lazy { snippetContext(currentInputConnection, withSelection = false) }"
              + m.group(1) + "\n            .filter { couldFitKeypad(it.text) }",
              s,
          )
          pat2 = re.compile(
              r"([ \t]*)/\*\*\s*\n\s*\* The snippets a number, phone, date or time field can take"
          )
          if len(pat2.findall(s)) != 1:
              raise SystemExit("ERROR: KDoc anchor not found exactly once")
          def add_fn(m):
              i = m.group(1)
              fn = (
                  i + "/** False for text with a letter and no brace: it can never fit a keypad. */\n"
                  + i + "private fun couldFitKeypad(text: String): Boolean {\n"
                  + i + "    if (text.indexOf('{') >= 0) return true\n"
                  + i + "    for (ch in text) if (ch.isLetter()) return false\n"
                  + i + "    return true\n"
                  + i + "}\n\n"
              )
              return fn + m.group(0)
          s = pat2.sub(add_fn, s)
          open(p, "w", encoding="utf-8").write(s)
          print("patch applied")
          PY
          git diff --stat
      - name: Raise import caps
        run: |
          csv=$(find . -name SnippetCsv.kt -path '*main*' | head -n1)
          file=$(find . -name SnippetFile.kt -path '*main*' | head -n1)
          grep -q 'private const val MAX_SNIPPETS = 500' "$csv" || { echo "ERROR: csv cap"; exit 1; }
          grep -q 'private const val MAX_SNIPPETS = 500' "$file" || { echo "ERROR: file cap"; exit 1; }
          grep -q 'private const val MAX_ROWS = 5_000' "$csv" || { echo "ERROR: rows cap"; exit 1; }
          sed -i 's/private const val MAX_SNIPPETS = 500/private const val MAX_SNIPPETS = 100_000/' "$csv" "$file"
          sed -i 's/private const val MAX_ROWS = 5_000/private const val MAX_ROWS = 500_000/' "$csv"
          grep -n 'MAX_SNIPPETS =\|MAX_ROWS =' "$csv" "$file"
      - name: Make snippet store save in a stream (big lists)
        run: |
          python3 - <<'PY'
          import glob, sys
          paths = [p for p in glob.glob('**/SnippetStore.kt', recursive=True) if '/src/main/' in p]
          if len(paths) != 1:
              sys.exit('ERROR: SnippetStore.kt found %d times' % len(paths))
          path = paths[0]
          s = open(path, encoding='utf-8').read()

          def swap(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  sys.exit('ERROR: %s found %d times' % (what, n))
              return s.replace(old, new)

          s = swap(s,
              'import kotlinx.serialization.json.Json\n',
              'import kotlinx.serialization.json.Json\n'
              'import kotlinx.serialization.json.decodeFromStream\n'
              'import kotlinx.serialization.json.encodeToStream\n',
              'json import')

          s = swap(s,
              '    @Synchronized\n'
              '    fun save() {\n'
              '        val file = storageFile ?: return\n'
              '        runCatching {\n'
              '            file.parentFile?.mkdirs()\n'
              '            file.writeText(json.encodeToString(Snapshot(snippets.toList(), folders.toList())))\n'
              '        }\n'
              '        pruneImages()\n'
              '    }\n',
              '    @OptIn(ExperimentalSerializationApi::class)\n'
              '    @Synchronized\n'
              '    fun save() {\n'
              '        val file = storageFile ?: return\n'
              '        runCatching {\n'
              '            file.parentFile?.mkdirs()\n'
              '            val tmp = File(file.parentFile, file.name + ".tmp")\n'
              '            tmp.outputStream().buffered().use { out ->\n'
              '                json.encodeToStream(Snapshot.serializer(), Snapshot(snippets.toList(), folders.toList()), out)\n'
              '            }\n'
              '            if (!tmp.renameTo(file)) throw java.io.IOException("rename failed")\n'
              '        }.onFailure { android.util.Log.e("WMSnippetStore", "save failed", it) }\n'
              '        pruneImages()\n'
              '    }\n',
              'save function')

          s = swap(s,
              '    @Synchronized\n    fun reload() {\n',
              '    @OptIn(ExperimentalSerializationApi::class)\n    @Synchronized\n    fun reload() {\n',
              'reload header')

          s = swap(s,
              'val snapshot = json.decodeFromString<Snapshot>(file.readText())',
              'val snapshot = file.inputStream().buffered().use { json.decodeFromStream<Snapshot>(it) }',
              'reload read line')

          open(path, 'w', encoding='utf-8').write(s)
          print('OK: streaming save and load added to', path)
          PY
          git diff --stat
      - name: Ask Android for a large heap
        run: |
          found=0
          for m in $(find . -name AndroidManifest.xml -path '*src/main*' -not -path '*/build/*'); do
            if grep -q '<application' "$m"; then
              found=1
              if grep -q 'largeHeap' "$m"; then
                echo "already set: $m"
              else
                sed -i '0,/<application/s//<application android:largeHeap="true"/' "$m"
                echo "patched: $m"
              fi
            fi
          done
          if [ "$found" = "0" ]; then echo "ERROR: no manifest with application tag"; exit 1; fi
          grep -rn 'largeHeap' --include=AndroidManifest.xml . | grep -v '/build/' || { echo "ERROR: largeHeap not set"; exit 1; }
      - name: File loose imports into folders
        run: |
          python3 - <<'PY'
          import glob, sys

          def one(name):
              paths = [p for p in glob.glob('**/' + name, recursive=True) if '/src/main/' in p]
              if len(paths) != 1:
                  sys.exit('ERROR: %s found %d times' % (name, len(paths)))
              return paths[0]

          def swap(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  sys.exit('ERROR: %s found %d times' % (what, n))
              return s.replace(old, new)

          # ---- SnippetFile.kt: helper + use it in decode ----
          fp = one('SnippetFile.kt')
          s = open(fp, encoding='utf-8').read()
          if 'foldLoose' in s:
              sys.exit('ERROR: foldLoose already present')

          s = swap(s,
              '        return ImportedSnippets(\n            snippets = kept,\n',
              '        val wmFiled = foldLoose(kept, folders)\n'
              '        return ImportedSnippets(\n            snippets = wmFiled.first,\n',
              'decode return')

          s = swap(s,
              '            folders = folders.filter { folder -> kept.any { it.folderId == folder.id } },',
              '            folders = wmFiled.second.filter { folder -> wmFiled.first.any { it.folderId == folder.id } },',
              'decode folders line')

          helper = '''    /** A file with at least this many snippets in no folder gets them filed. */
          private const val WM_LOOSE_MIN = 50

          /** Snippets per auto-made folder. */
          private const val WM_FOLDER_CHUNK = 5_000

          /**
           * Files snippets that sit in no folder into new folders of
           * [WM_FOLDER_CHUNK], named Import_01, Import_02 and so on. A handful of
           * loose snippets (fewer than [WM_LOOSE_MIN]) is left alone.
           * Folder ids only mean something inside the file; the store reassigns them.
           */
          internal fun foldLoose(
              snippets: List<Snippet>,
              folders: List<SnippetFolder>,
          ): Pair<List<Snippet>, List<SnippetFolder>> {
              if (snippets.count { it.folderId == 0L } < WM_LOOSE_MIN) return snippets to folders
              var nextId = (folders.maxOfOrNull { it.id } ?: 0L) + 1L
              val outFolders = ArrayList<SnippetFolder>(folders)
              val newIds = ArrayList<Long>()
              var seen = 0
              val result = snippets.map { snippet ->
                  if (snippet.folderId != 0L) {
                      snippet
                  } else {
                      val slot = seen / WM_FOLDER_CHUNK
                      seen++
                      if (slot >= newIds.size) {
                          if (folders.size + newIds.size >= MAX_FOLDERS) return@map snippet
                          val id = nextId++
                          outFolders += SnippetFolder(
                              id = id,
                              name = "Import_" + (slot + 1).toString().padStart(2, '0'),
                          )
                          newIds += id
                      }
                      snippet.copy(folderId = newIds[slot])
                  }
              }
              return result to outFolders
          }

          '''
          anchor = "    /**\n     * The snippet's further expansions, shortened and capped like its text."
          s = swap(s, anchor, helper + anchor, 'helper anchor')
          open(fp, 'w', encoding='utf-8').write(s)
          print('OK: SnippetFile.kt patched')

          # ---- SnippetCsv.kt: use it in convert ----
          cp = one('SnippetCsv.kt')
          c = open(cp, encoding='utf-8').read()
          c = swap(c,
              '        return Read(\n            snippets = snippets,\n            folders = folders.values.toList(),\n',
              '        val wmFiled = SnippetFile.foldLoose(snippets, folders.values.toList())\n'
              '        return Read(\n            snippets = wmFiled.first,\n            folders = wmFiled.second,\n',
              'csv return')
          open(cp, 'w', encoding='utf-8').write(c)
          print('OK: SnippetCsv.kt patched')
          PY
          git diff --stat
      - name: Add snippet search box
        run: |
          python3 - <<'PY'
          import glob, re, sys
          paths = [p for p in glob.glob('**/SnippetScreens.kt', recursive=True) if '/src/main/' in p]
          if len(paths) != 1:
              sys.exit('ERROR: SnippetScreens.kt found %d times' % len(paths))
          path = paths[0]
          src = open(path, encoding='utf-8').read()
          for name in ('wmSearch', 'wmQuery', 'wmHits', 'wmKeys', 'wmNeedle', 'wmNorm'):
              if name in src:
                  sys.exit('ERROR: name already used: ' + name)
          pat = re.compile(r'^([ \t]*)// The pencil is the one way into every destructive or fiddly thing a list[ \t]*$', re.M)
          found = pat.findall(src)
          if len(found) != 1:
              sys.exit('ERROR: anchor found %d times' % len(found))
          block = '''var wmSearch by rememberSaveable { mutableStateOf("") }
          OutlinedTextField(
              value = wmSearch,
              onValueChange = { wmSearch = it },
              singleLine = true,
              label = { Text("جستجو") },
              modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp),
          )
          val wmQuery = wmSearch.trim()
          if (wmQuery.length >= 2) {
              val wmSpaces = remember { Regex(" +") }
              val wmNorm = { t: String ->
                  t.lowercase()
                      .replace('ي', 'ی')
                      .replace('ك', 'ک')
                      .replace("\\u200c", "")
                      .map { c -> if (c.isLetterOrDigit()) c else ' ' }
                      .joinToString("")
                      .replace(wmSpaces, " ")
                      .trim()
              }
              val wmKeys by androidx.compose.runtime.produceState(emptyList<String>(), snippets) {
                  value = kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.Default) {
                      snippets.map { " " + wmNorm(it.label.ifBlank { it.text }) }
                  }
              }
              val wmNeedle = " " + wmNorm(wmQuery)
              val wmHits = remember(wmKeys, wmNeedle) {
                  if (wmKeys.size != snippets.size) {
                      emptyList()
                  } else {
                      wmKeys.indices.asSequence()
                          .filter { wmKeys[it].contains(wmNeedle) }
                          .take(300)
                          .map { snippets[it] }
                          .sortedBy { it.label.ifBlank { it.text } }
                          .toList()
                  }
              }
              SnippetGroup(
                  title = "نتایج جستجو (${wmHits.size})",
                  snippets = wmHits.take(50),
                  empty = "چیزی پیدا نشد",
                  onOpen = { snippet -> onNavigate("expander/edit/${snippet.id}") },
                  onDelete = ::deleteWithUndo,
                  onReorder = { },
              )
          }
          Spacer(Modifier.height(12.dp))
          '''
          ind = found[0]
          indented = ''.join((ind + l if l.strip() else l) for l in block.splitlines(True))
          new = pat.sub(lambda m: indented + m.group(0), src, count=1)
          with open(path, 'w', encoding='utf-8') as f:
              f.write(new)
          print('OK: search box added to', path)
          PY
      - name: Add snippet pages and alphabetical sort
        run: |
          python3 - <<'PY'
          import glob, re, sys
          paths = [p for p in glob.glob('**/SnippetScreens.kt', recursive=True) if '/src/main/' in p]
          if len(paths) != 1:
              sys.exit('ERROR: SnippetScreens.kt found %d times' % len(paths))
          path = paths[0]
          src = open(path, encoding='utf-8').read()
          for name in ('wmPage', 'wmPages', 'wmPageSafe', 'wmShown', 'wmPager', 'wmAlpha', 'wmCollator', 'wmSorted', 'wmList', 'wmSortRow'):
              if name in src:
                  sys.exit('ERROR: name already used: ' + name)
          sig = 'private fun SnippetGroup('
          if src.count(sig) != 1:
              sys.exit('ERROR: SnippetGroup definition not found exactly once')
          start = src.find(sig)
          marker = '/** One snippet in the Text Expander list'
          if src.count(marker) != 1:
              sys.exit('ERROR: end marker not found exactly once')
          end = src.find(marker, start)
          if end < 0:
              sys.exit('ERROR: end marker is before SnippetGroup')
          body = src[start:end]
          can_pat = r'^([ \t]*)val canEdit = snippets\.size > 1[ \t]*$'
          for_pat = r'^([ \t]*)for \(snippet in snippets\) \{[ \t]*$'
          for pat, what in ((can_pat, 'canEdit line'), (for_pat, 'for loop')):
              n = len(re.findall(pat, body, flags=re.M))
              if n != 1:
                  sys.exit('ERROR: %s found %d times' % (what, n))
          tail = '\n    }\n}'
          stripped = body.rstrip()
          if not stripped.endswith(tail):
              sys.exit('ERROR: end of SnippetGroup is not as expected')
          trailing = body[len(stripped):]
          defs = '''var wmAlpha by rememberSaveable(title) { mutableStateOf(false) }
          val wmCollator = java.text.Collator.getInstance(java.util.Locale("fa"))
          val wmList = remember(snippets, wmAlpha) {
              if (wmAlpha) snippets.sortedWith(compareBy(wmCollator) { it.label.ifBlank { it.text } }) else snippets
          }
          var wmPage by rememberSaveable(title) { mutableStateOf(0) }
          val wmPages = maxOf(1, (wmList.size + 199) / 200)
          val wmPageSafe = wmPage.coerceIn(0, wmPages - 1)
          val wmShown = wmList.drop(wmPageSafe * 200).take(200)
          val wmSortRow: @Composable () -> Unit = {
              if (snippets.size > 1) {
                  androidx.compose.material3.TextButton(
                      onClick = { wmAlpha = !wmAlpha },
                      modifier = Modifier.padding(horizontal = 8.dp),
                  ) { Text(if (wmAlpha) "ترتیب الفبایی: روشن" else "ترتیب الفبایی: خاموش") }
              }
          }
          val wmPager: @Composable () -> Unit = {
              if (snippets.size > 200) {
                  androidx.compose.foundation.layout.Row(
                      modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp),
                      horizontalArrangement = androidx.compose.foundation.layout.Arrangement.SpaceBetween,
                      verticalAlignment = androidx.compose.ui.Alignment.CenterVertically,
                  ) {
                      androidx.compose.material3.TextButton(
                          onClick = { wmPage = wmPageSafe - 1 },
                          enabled = wmPageSafe > 0,
                      ) { Text("قبلی") }
                      Text("صفحه ${wmPageSafe + 1} از $wmPages")
                      androidx.compose.material3.TextButton(
                          onClick = { wmPage = wmPageSafe + 1 },
                          enabled = wmPageSafe < wmPages - 1,
                      ) { Text("بعدی") }
                  }
              }
          }
          '''
          m = re.search(can_pat, body, flags=re.M)
          ind = m.group(1)
          indented = ''.join((ind + l if l.strip() else l) for l in defs.splitlines(True))
          body = (body[:m.start()] + indented + ind + 'val canEdit = !wmAlpha && snippets.size in 2..500'
                  + body[m.end():])
          body = re.sub(
              for_pat,
              lambda mm: mm.group(1) + 'item { wmSortRow() }\n' + mm.group(1) + 'item { wmPager() }\n' + mm.group(1) + 'for (snippet in wmShown) {',
              body, count=1, flags=re.M)
          stripped = body.rstrip()
          if not stripped.endswith(tail):
              sys.exit('ERROR: end of SnippetGroup changed unexpectedly')
          body = stripped[:-len(tail)] + '\n        item { wmPager() }' + tail + trailing
          with open(path, 'w', encoding='utf-8') as f:
              f.write(src[:start] + body + src[end:])
          print('OK: pages and sort added to', path)
          PY
      - name: Add instant expansion switch for all snippets
        run: |
          python3 - <<'PY'
          import glob, sys

          def one(name):
              paths = [p for p in glob.glob('**/' + name, recursive=True) if '/src/main/' in p]
              if len(paths) != 1:
                  sys.exit('ERROR: %s found %d times' % (name, len(paths)))
              return paths[0]

          def swap(s, old, new, what):
              n = s.count(old)
              if n != 1:
                  sys.exit('ERROR: %s found %d times' % (what, n))
              return s.replace(old, new)

          # ---- SnippetStore.kt: edit every snippet at once ----
          sp = one('SnippetStore.kt')
          s = open(sp, encoding='utf-8').read()
          if 'wmEditAll' in s:
              sys.exit('ERROR: wmEditAll already present')
          fn = '''    /** Writes [edit] into every snippet at once and says how many changed. */
              @Synchronized
              fun wmEditAll(edit: SnippetBulkEdit): Int {
                  if (edit.isEmpty) return 0
                  var changed = 0
                  for (i in snippets.indices) {
                      val snippet = snippets[i]
                      val next = edit.applyTo(snippet)
                      if (next == snippet) continue
                      snippets[i] = normalize(next, id = snippet.id, createdAt = snippet.createdAt)
                      changed++
                  }
                  if (changed > 0) lookup = null
                  return changed
              }

          '''
          anchor = '    /**\n     * Replaces the whole list with [items], exactly as given.'
          s = swap(s, anchor, fn + anchor, 'replaceAll anchor')
          open(sp, 'w', encoding='utf-8').write(s)
          print('OK: wmEditAll added to', sp)

          # ---- SnippetScreens.kt: the switch on the main snippet page ----
          ap = one('SnippetScreens.kt')
          a = open(ap, encoding='utf-8').read()
          if 'wmAllImmediate' in a:
              sys.exit('ERROR: wmAllImmediate already present')
          block = '''val wmAllImmediate = remember(snippets) {
              snippets.isNotEmpty() && snippets.all {
                  it.immediate || it.confirm || !it.triggerPattern.isNullOrBlank() || it.trigger.isNullOrBlank()
              }
          }
          Row(
              modifier = Modifier.fillMaxWidth().padding(horizontal = 16.dp),
              horizontalArrangement = Arrangement.SpaceBetween,
              verticalAlignment = Alignment.CenterVertically,
          ) {
              Text("گسترش فوری برای همه اسنیپت‌ها", modifier = Modifier.weight(1f))
              androidx.compose.material3.Switch(
                  checked = wmAllImmediate,
                  enabled = store != null,
                  onCheckedChange = { wmOn ->
                      val wmBefore = store?.items()
                      if (wmBefore != null) {
                          mutate { it.wmEditAll(SnippetBulkEdit(immediate = wmOn)) }
                          snackbar?.undo(
                              message = if (wmOn) "گسترش فوری برای همه روشن شد" else "گسترش فوری برای همه خاموش شد",
                              undoLabel = undoLabel,
                          ) {
                              mutate { it.replaceAll(wmBefore) }
                          }
                      }
                  },
              )
          }
          Spacer(Modifier.height(12.dp))
          '''
          indented = ''.join(('    ' + l if l.strip() else l) for l in block.splitlines(True))
          anchor2 = '    RegisterAddFab(stringResource(R.string.expander_add_action)) { onNavigate("expander/edit/0") }\n'
          a = swap(a, anchor2, indented + anchor2, 'add fab anchor')
          open(ap, 'w', encoding='utf-8').write(a)
          print('OK: switch added to', ap)
          PY
          git diff --stat
      - uses: actions/checkout@v7
        with:
          path: wm-words
      - name: Make instant switch skip real-word triggers
        run: |
          python3 - <<'PY'
          import glob, os, re, shutil, sys
          ws = os.environ['GITHUB_WORKSPACE']
          def one(name, must):
              paths = [p for p in glob.glob(ws + '/**/' + name, recursive=True) if '/src/main/' in p and must in p]
              if len(paths) != 1:
                  sys.exit('ERROR: %s found %d times' % (name, len(paths)))
              return paths[0]
          def swap(s, pattern, new, what):
              out, n = re.subn(pattern, lambda m: new, s)
              if n != 1:
                  sys.exit('ERROR: %s found %d times' % (what, n))
              return out
          words = ws + '/wm-words/.github/workflows/real-words.txt'
          if not os.path.exists(words):
              sys.exit('ERROR: real-words.txt not found')

          # ---- SnippetStore.kt: wmEditAll takes an optional filter ----
          sp = one('SnippetStore.kt', '/core/content/')
          root = sp.split('/core/content/')[0]
          s = open(sp, encoding='utf-8').read()
          if 'accept: (Snippet)' in s:
              sys.exit('ERROR: filter already present')
          s = swap(s, r'fun wmEditAll\(edit: SnippetBulkEdit\): Int \{', 'fun wmEditAll(edit: SnippetBulkEdit, accept: (Snippet) -> Boolean = { true }): Int {', 'wmEditAll signature')
          i = s.index('fun wmEditAll(')
          j = s.index('val next = edit.applyTo(snippet)', i)
          s = s[:j] + 'if (!accept(snippet)) continue\n            ' + s[j:]
          open(sp, 'w', encoding='utf-8').write(s)

          # ---- new Kotlin file with the rule ----
          kt = os.path.join(os.path.dirname(sp), 'WmRealWords.kt')
          if os.path.exists(kt):
              sys.exit('ERROR: WmRealWords.kt already present')
          code = r'''package com.wasimaster.wmkeyboard.core.snippets

          import java.util.TreeSet

          /** Real Persian words; a trigger that is not one (nor the start of one) is safe to expand at once. */
          object WmRealWords {
              @Volatile
              private var words: TreeSet<String>? = null

              fun isLoaded(): Boolean = words != null

              fun load(lines: Sequence<String>) {
                  val set = TreeSet<String>()
                  for (line in lines) {
                      val w = norm(line)
                      if (w.isNotEmpty()) set.add(w)
                  }
                  if (set.size > 1000) words = set
              }

              private fun norm(raw: String): String {
                  val sb = StringBuilder(raw.length)
                  for (ch in raw.trim()) {
                      when (ch) {
                          '\u200C', '\u200D', '\u0640' -> {}
                          '\u064A' -> sb.append('\u06CC')
                          '\u0643' -> sb.append('\u06A9')
                          else -> {
                              if (ch !in '\u064B'..'\u0652') sb.append(ch)
                          }
                      }
                  }
                  return sb.toString()
              }

              private fun isPersianLetter(c: Char): Boolean =
                  c in '\u0621'..'\u064A' || c == '\u067E' || c == '\u0686' ||
                      c == '\u0698' || c == '\u06AF' || c == '\u06A9' || c == '\u06CC'

              fun isNonsense(raw: String?): Boolean {
                  val set = words ?: return false
                  if (raw == null) return false
                  val t = norm(raw)
                  if (t.length < 3) return false
                  for (c in t) if (!isPersianLetter(c)) return false
                  val near = set.ceiling(t)
                  return near == null || !near.startsWith(t)
              }

              fun canBeImmediate(s: Snippet): Boolean {
                  if (s.confirm || !s.triggerPattern.isNullOrBlank()) return false
                  if (!isNonsense(s.trigger)) return false
                  for (a in s.aliases) if (!isNonsense(a)) return false
                  return true
              }
          }
          '''
          code = '\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in code.split('\n'))
          open(kt, 'w', encoding='utf-8').write(code)

          # ---- SnippetScreens.kt: the switch ----
          ap = one('SnippetScreens.kt', '/app/src/main/')
          a = open(ap, encoding='utf-8').read()
          W = 'com.wasimaster.wmkeyboard.core.snippets.WmRealWords'
          setup = r'''val wmCtx = androidx.compose.ui.platform.LocalContext.current
                  val wmWordsState = remember { mutableStateOf(WMW.isLoaded()) }
                  androidx.compose.runtime.LaunchedEffect(Unit) {
                      if (!wmWordsState.value) {
                          try {
                              kotlinx.coroutines.withContext(kotlinx.coroutines.Dispatchers.IO) {
                                  wmCtx.assets.open("real-words.txt").bufferedReader().useLines { WMW.load(it) }
                              }
                              wmWordsState.value = WMW.isLoaded()
                          } catch (e: Exception) {
                          }
                      }
                  }
                  val wmAllImmediate = remember(snippets, wmWordsState.value) {'''.replace('WMW', W)
          a = swap(a, r'val wmAllImmediate = remember\(snippets\) \{', setup, 'remember anchor')
          cond = 'wmWordsState.value && snippets.isNotEmpty() && snippets.all {\n                it.immediate || !' + W + '.canBeImmediate(it)'
          a = swap(a, r'snippets\.isNotEmpty\(\)\s*&&\s*snippets\.all\s*\{\s*it\.immediate\s*\|\|\s*it\.confirm\s*\|\|\s*!it\.triggerPattern\.isNullOrBlank\(\)\s*\|\|\s*it\.trigger\.isNullOrBlank\(\)', cond, 'all-immediate check')
          call = r'''mutate {
                              val wmN = it.wmEditAll(SnippetBulkEdit(immediate = wmOn)) { s ->
                                  !wmOn || WMW.canBeImmediate(s)
                              }
                              android.os.Handler(android.os.Looper.getMainLooper()).post {
                                  android.widget.Toast.makeText(
                                      wmCtx,
                                      if (wmOn) "فوری شد برای " + wmN + " اسنیپت" else "فوری خاموش شد برای " + wmN + " اسنیپت",
                                      android.widget.Toast.LENGTH_LONG,
                                  ).show()
                              }
                          }'''.replace('WMW', W)
          a = swap(a, r'mutate\s*\{\s*it\.wmEditAll\(SnippetBulkEdit\(immediate = wmOn\)\)\s*\}', call, 'mutate call')
          open(ap, 'w', encoding='utf-8').write(a)

          # ---- the words file goes inside the app ----
          dest = root + '/app/src/main/assets'
          os.makedirs(dest, exist_ok=True)
          shutil.copy(words, dest + '/real-words.txt')
          print('OK: filter added; root =', root)
          PY
      - name: Assemble
        run: ./gradlew assembleIntlDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: apk-wm-search-debug
          path: app/build/outputs/apk/intl/debug/*.apk
          retention-days: 7
